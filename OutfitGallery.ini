[Input]
; DirectInput keyboard scan code: 66 = F8.
; Change this if F8 is already used by another mod.
Hotkey=66

; F9 saves the outfit while the studio is open.
SaveHotkey=67

; View / Back held for 0.8s toggles the studio. Set 0 to disable the gamepad hotkey.
GamepadHotkey=32

; Options writes Hotkeys.json, which takes priority over Hotkey/GamepadHotkey.
